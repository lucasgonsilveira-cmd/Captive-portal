# ============================================================================
# DNSMASQ.CONF — DHCP + DNS do hotspot
# Quem inicia: rede.sh (dnsmasq --conf-file=...). Não use o serviço "dnsmasq"
# do sistema ao mesmo tempo (o rede.sh já o desliga).
# ============================================================================

# Mesma interface do AP_IF e mesmo IP do PORTAL_IP (config.env)
interface=wlan0
listen-address=192.168.50.1
bind-interfaces

# ----------------------------------------------------------------------
# DHCP
# ----------------------------------------------------------------------
# Faixa grande + concessão curta (30 min). Quem limita quantos aparelhos ficam
# conectados ao mesmo tempo é o max_num_sta do hostapd.conf. (Antes: 8 endereços
# com 12 h de concessão — o 9º visitante da tarde ficaria sem IP mesmo com o
# wifi vazio, porque os 8 primeiros "segurariam" o endereço por 12 horas.)
dhcp-range=192.168.50.10,192.168.50.200,255.255.255.0,30m
dhcp-authoritative
dhcp-option=option:router,192.168.50.1
dhcp-option=option:dns-server,192.168.50.1
dhcp-leasefile=/run/portal/dnsmasq.leases

# ----------------------------------------------------------------------
# DNS
# ----------------------------------------------------------------------
# DNS NORMAL para a internet (usa o /etc/resolv.conf do box + estes reservas).
# Se a rede da faculdade bloquear DNS externo, apague as duas linhas "server=".
server=1.1.1.1
server=8.8.8.8

# Os endereços que os celulares/PCs consultam para saber "tenho internet?"
# apontam SEMPRE para o portal. Quem responde é o app.py:
#   - visitante ainda não liberado -> redireciona para o portal (o celular abre a janela de login sozinho)
#   - visitante liberado           -> responde "tudo certo" (o celular some com o aviso)
# Isso também funciona quando o box está SEM internet.
address=/connectivitycheck.gstatic.com/192.168.50.1
address=/connectivitycheck.android.com/192.168.50.1
address=/clients3.google.com/192.168.50.1
address=/captive.apple.com/192.168.50.1
address=/www.msftconnecttest.com/192.168.50.1
address=/detectportal.firefox.com/192.168.50.1
address=/portal.fatec/192.168.50.1

# ----------------------------------------------------------------------
# Logs (em memória, somem ao reiniciar; poupam o cartão SD)
# ----------------------------------------------------------------------
log-dhcp
log-facility=/run/portal/dnsmasq.log
pid-file=/run/portal/dnsmasq.pid
