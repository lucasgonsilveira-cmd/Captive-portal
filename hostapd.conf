# ============================================================================
# HOSTAPD.CONF — transforma o Wi-Fi do TV box em Access Point
# Quem inicia: rede.sh (hostapd -B ...). Teste manual: sudo hostapd -d hostapd.conf
# ============================================================================

# Mesma interface do AP_IF no config.env
interface=wlan0
driver=nl80211

ssid=TCC-Fatec-Jahu

# Regulamentação do Brasil (libera os canais 1-13 e a potência correta)
country_code=BR
ieee80211d=1

# 2.4 GHz, canal 6 (1, 6 e 11 não se sobrepõem). Antes do evento, rode
# "sudo iw dev wlan0 scan | grep -E 'SSID|freq'" e escolha o canal menos usado.
hw_mode=g
channel=6

# 802.11n + WMM. SE o hostapd reclamar de "HT" com o seu chip, apague estas duas linhas.
ieee80211n=1
wmm_enabled=1

# Máximo de aparelhos conectados ao mesmo tempo (combinado: 8).
# No evento você pode testar 12 ou 16; o limite real é o chip Wi-Fi do box.
max_num_sta=8

# Um visitante não enxerga o aparelho do outro (rede aberta em evento público)
ap_isolate=1

# Rede ABERTA de propósito: quem controla o acesso é o portal (Flask + iptables)
auth_algs=1
wpa=0
ignore_broadcast_ssid=0
